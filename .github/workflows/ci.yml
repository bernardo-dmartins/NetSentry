name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
      REDIS_URL: ${{ secrets.REDIS_URL }}

      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_SOCKET_URL: http://localhost:5000
      REACT_APP_MONITORING_INTERVAL: 30
      REACT_APP_ENV: test
      REACT_APP_NAME: NetSentry
      REACT_APP_VERSION: 1.0.0

      DISABLE_RATE_LIMIT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências da raiz
        run: npm ci

      - name: Instalar dependências do backend
        working-directory: monitoring-backend
        run: npm ci

      - name: Instalar dependências do frontend
        working-directory: monitoring-frontend
        run: npm ci

      - name: Validar build do frontend
        run: npm run build  

      - name: Executar testes E2E
        run: npm run test:e2e