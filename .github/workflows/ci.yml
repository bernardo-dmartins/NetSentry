name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      JWT_SECRET: netsentry-e2e-only-secret
      CORS_ORIGIN: http://localhost:3000
      DB_STORAGE: ":memory:"
      REDIS_URL: redis://localhost:6379

      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_SOCKET_URL: http://localhost:5000
      REACT_APP_MONITORING_INTERVAL: 10
      REACT_APP_ENV: test
      REACT_APP_NAME: NetSentry
      REACT_APP_VERSION: 1.0.0

      DISABLE_RATE_LIMIT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências da raiz
        run: npm ci

      - name: Instalar dependências do backend
        working-directory: monitoring-backend
        run: npm ci

      - name: Instalar dependências do frontend
        working-directory: monitoring-frontend
        run: npm ci

      - name: Validar build do frontend
        run: npm run build

      - name: Executar testes E2E
        run: npm run test:e2e
